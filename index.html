<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santos Automotive Manager</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0066FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Santos Automotive" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => {
            reg.update();
            console.log('SW registered:', reg);
          }).catch(err => {
            console.log('SW registration failed:', err);
          });
        });

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data?.type === 'SW_UPDATED' && !sessionStorage.getItem('santos-sw-refresh')) {
            sessionStorage.setItem('santos-sw-refresh', '1');
            window.location.reload();
          }
        });

        window.setTimeout(() => {
          const root = document.getElementById('root');
          if (root && !root.hasChildNodes() && !sessionStorage.getItem('santos-blank-recover')) {
            sessionStorage.setItem('santos-blank-recover', '1');
            navigator.serviceWorker.getRegistrations()
              .then(registrations => Promise.all(registrations.map(reg => reg.update())))
              .finally(() => window.location.reload());
          }
        }, 3000);
      }
    </script>
  </body>
</html>
